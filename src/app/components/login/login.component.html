<div class="login-form flex justify-center align-center direction-column">
    <div class="welcome-back">Welcome Back!</div>
    <p class="enter-credential">Enter your Credentials to access your account</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.invalid">
            <mat-error class="mat-error" *ngIf="loginForm.get('name')?.errors?.['required']">Name is required</mat-error>
        </div>
        <div class="flex direction-column margin-top">
            <label class="label">Email</label>
            <mat-form-field appearance="outline" class="rounded-form-field" >
                <input  matInput formControlName="email">
            </mat-form-field>
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <mat-error class="mat-error"  *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</mat-error>
        </div>
         <div class="flex direction-column margin-top">
            <div class="flex justify-between">
                <label class="label">Password</label>
                <p class="forget-password">forget password</p>
            </div>
            <mat-form-field appearance="outline" class="rounded-form-field" >
                <input matInput formControlName="password">
            </mat-form-field>
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <mat-error class="mat-error" *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</mat-error>
        </div>
        <div class="flex gap radio">
            <input type="radio"/>
            <p class="agree">Remember for 30 days</p>
        </div>
        <button [disabled]="loginForm.invalid" mat-raised-button color="primary" class="margin-top submit-btn">Sign In</button>
    </form>
    <div class="line"></div>
    <div class="flex justify-between margin-top-20 sign-in-other-way">
        <div class="border flex align-center gap"><img width="15" src="https://images.icon-icons.com/729/PNG/96/google_icon-icons.com_62736.png" alt=""> Sign in with google</div>
        <div class="border flex align-center gap"><img width="15" src="https://images.icon-icons.com/1/PNG/96/social_apple_mac_65.png" alt=""> Sign in with apple</div>
    </div>
    <div class="flex gap account">Don't Have an account? <a [routerLink]="['/registration']">Sign Up</a></div>
</div>
